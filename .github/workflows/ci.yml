name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.22 is the floor: a vela project requires it, and so does vela
        # (engines). Testing the floor itself, not just the latest 22, catches
        # an API used before it existed. The bundle targets node22 (see
        # scripts/build.ts).
        node-version: ['22.22', 24, 26]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The server scripts only run on the server, as root, so their helpers
      # are exercised here in a scratch directory: locking, id validation,
      # release ordering and the health gate.
      - name: Test the server scripts
        run: npm run test:scripts

      - name: Build
        run: npm run build
