name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write # required for npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11.x, required for OIDC trusted publishing (>= 11.5.1).
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm run lint
      - run: npm test
      - run: npm run build

      # The bundle inlines package.json's version at build time. Check the
      # built CLI, not just package.json, so a stale or mis-built dist can't
      # publish under the wrong number.
      - name: Verify built CLI reports the tag version
        run: |
          BUILT_VERSION=$(node dist/bin.js --version)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$BUILT_VERSION" != "$TAG_VERSION" ]; then
            echo "Built CLI reports $BUILT_VERSION, tag is $TAG_VERSION"
            exit 1
          fi

      # A prerelease (0.15.0-next.0) goes to the `next` dist-tag, so `npx vela`
      # keeps resolving the last stable release until a stable tag is pushed.
      - name: Publish to npm
        run: |
          case "${GITHUB_REF_NAME#v}" in
            *-*) npm publish --access public --provenance --tag next ;;
            *) npm publish --access public --provenance ;;
          esac
