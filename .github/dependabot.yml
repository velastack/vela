version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # pocketbase-server 1.0.x is an older, abandoned line of the package from
      # 2025 that happens to sort above the 0.40.x releases, which track the
      # PocketBase (velabase) version they wrap. Never "upgrade" to it.
      - dependency-name: pocketbase-server
        versions:
          - '>=1.0.0'
      # Raised by the Sync versions workflow, together with the templates'
      # dependency ranges that follow it (src/lib/template-versions.test.ts
      # fails when one moves without the other).
      - dependency-name: '@velastack/patterns'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
